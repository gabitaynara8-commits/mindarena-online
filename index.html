<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MindArena PRO</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#0b1320;
  color:white;
}

button{
  padding:10px;
  margin:5px;
  cursor:pointer;
}

.hidden{display:none;}

.grid{
  display:grid;
  grid-template-columns: repeat(6,60px);
  gap:5px;
  justify-content:center;
}

.cell{
  background:white;
  color:black;
  padding:15px;
  font-weight:bold;
}

canvas{
  border:1px solid white;
}
</style>
</head>

<body>

<!-- 🔥 LOBBY -->
<div id="lobby">
<h1>MindArena</h1>

<button onclick="createRoom()">Criar Sala</button><br>
<input id="room" placeholder="Código"><br>
<input id="name" placeholder="Nome"><br>
<button onclick="joinRoom()">Entrar</button>

<h2 id="roomCode"></h2>
<canvas id="qr"></canvas>

<div id="players"></div>
<button onclick="start()">Iniciar</button>
</div>

<!-- 🔥 JOGO -->
<div id="game" class="hidden">
<h1>JOGO INICIADO</h1>

<button onclick="loadGame('memory')">Memória</button>
<button onclick="loadGame('attention')">Atenção</button>
<button onclick="loadGame('draw')">Desenho</button>

<div id="gameArea"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_lRiGKF3c8ILfn2lKNPEWL5mC7voSYBQ",
  authDomain: "neuropsi-bcee0.firebaseapp.com",
  databaseURL: "https://neuropsi-bcee0-default-rtdb.firebaseio.com",
  projectId: "neuropsi-bcee0",
  storageBucket: "neuropsi-bcee0.firebasestorage.app",
  messagingSenderId: "882652217132",
  appId: "1:882652217132:web:2beba920b4e4a0298cf689"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = "";
let playerId = "p" + Date.now();

function createRoom(){
  roomId = Math.random().toString(36).substr(2,4).toUpperCase();

  set(ref(db,'rooms/'+roomId),{
    started:false,
    players:{}
  });

  document.getElementById("room").value = roomId;
  joinRoom("Host");
}

function joinRoom(defaultName){
  roomId = document.getElementById("room").value || roomId;

  let nameInput = document.getElementById("name").value;

  const name = nameInput && nameInput.trim() !== "" 
    ? nameInput 
    : (defaultName || "Jogador");

  update(ref(db,'rooms/'+roomId+'/players/'+playerId),{
    name: name
  });

  listen();
}

function listen(){
  onValue(ref(db,'rooms/'+roomId),(snap)=>{
    const data = snap.val();
    if(!data) return;

    document.getElementById("roomCode").innerText = roomId;

    const list = Object.values(data.players || {});
    document.getElementById("players").innerHTML =
      list.map(p=>`<div>${p.name}</div>`).join('');

    // 🔥 TROCA PRA TELA DE JOGO
    if(data.started){
      document.getElementById("lobby").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
    }
  });

  QRCode.toCanvas(
    document.getElementById("qr"),
    window.location.href + "?room=" + roomId
  );
}

function start(){
  update(ref(db,'rooms/'+roomId),{started:true});
}

window.createRoom = createRoom;
window.joinRoom = joinRoom;
window.start = start;

//////////////////////////////////////////////////
// 🎮 SISTEMA DE JOGOS
//////////////////////////////////////////////////

window.loadGame = function(type){

  const area = document.getElementById("gameArea");

  if(type === "memory"){
    // 🔥 GRID DE MEMÓRIA
    const nums = Array.from({length:36},(_,i)=>i+1)
      .sort(()=>Math.random()-0.5);

    area.innerHTML = `
      <h2>Memorize os números</h2>
      <div class="grid">
        ${nums.map(n=>`<div class="cell">${n}</div>`).join('')}
      </div>
    `;

    setTimeout(()=>{
      document.querySelectorAll(".cell").forEach(c=>c.innerText="?");
    },3000);
  }

  if(type === "attention"){if(type === "memory"){

  let current = 1;

  const nums = Array.from({length:36},(_,i)=>i+1)
    .sort(()=>Math.random()-0.5);

  area.innerHTML = `
    <h2>Clique na sequência: 1 → 36</h2>
    <p>Atual: <span id="current">${current}</span></p>
    <div class="grid" id="grid"></div>
  `;

  const grid = document.getElementById("grid");

  nums.forEach(n=>{
    const div = document.createElement("div");
    div.className = "cell";
    div.innerText = n;
    div.dataset.value = n;

    div.onclick = ()=>{

      if(parseInt(div.dataset.value) === current){

        // ✅ ACERTO
        div.style.background = "green";
        div.style.color = "white";

        current++;
        document.getElementById("current").innerText = current;

        if(current > 36){
          alert("Finalizado com sucesso!");
        }

      }else{

        // ❌ ERRO
        div.style.background = "red";

        setTimeout(()=>{
          div.style.background = "white";
        },300);
      }
    };

    grid.appendChild(div);
  });
}

  if(type === "draw"){
    // 🔥 DESENHO
    area.innerHTML = `
      <h2>Desenhe a figura</h2>
      <canvas id="drawCanvas" width="300" height="300"></canvas>
    `;

    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d");

    let drawing=false;

    canvas.onmousedown=()=>drawing=true;
    canvas.onmouseup=()=>drawing=false;
    canvas.onmousemove=(e)=>{
      if(!drawing) return;
      ctx.fillRect(e.offsetX,e.offsetY,3,3);
    };
  }

}

</script>

</body>
</html>
