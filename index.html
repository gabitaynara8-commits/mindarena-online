<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MindArena Online</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#0b1320;
  color:white;
}

/* LOBBY */
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#00d4ff;
  color:black;
  cursor:pointer;
}

/* JOGO */
#gameContainer{
  display:none;
}

.game-box{
  margin-top:50px;
}

.question{
  font-size:24px;
  margin:20px;
}

.answer{
  display:block;
  margin:10px auto;
  padding:10px;
  width:200px;
  background:#1c2541;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- 🔥 LOBBY -->
<h1>MindArena</h1>

<button onclick="createRoom()">Criar Sala</button><br>
<input id="room" placeholder="Código"><br>
<input id="name" placeholder="Nome"><br>
<button onclick="joinRoom()">Entrar</button>

<h2 id="roomCode"></h2>
<canvas id="qr"></canvas>
<div id="players"></div>
<button onclick="start()">Iniciar</button>

<!-- 🎮 JOGO -->
<div id="gameContainer">
  <h1>MindArena - Jogo</h1>

  <div class="game-box">
    <div id="question" class="question"></div>
    <div id="answers"></div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_lRiGKF3c8ILfn2lKNPEWL5mC7voSYBQ",
  authDomain: "neuropsi-bcee0.firebaseapp.com",
  databaseURL: "https://neuropsi-bcee0-default-rtdb.firebaseio.com",
  projectId: "neuropsi-bcee0",
  storageBucket: "neuropsi-bcee0.firebasestorage.app",
  messagingSenderId: "882652217132",
  appId: "1:882652217132:web:2beba920b4e4a0298cf689"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = "";
let playerId = "p" + Date.now();


// 🔥 CRIAR SALA
function createRoom(){
  roomId = Math.random().toString(36).substr(2,4).toUpperCase();

  set(ref(db,'rooms/'+roomId),{
    started:false,
    players:{}
  });

  document.getElementById("room").value = roomId;
  joinRoom("Host");
}


// 🔥 ENTRAR
function joinRoom(defaultName){
  roomId = document.getElementById("room").value || roomId;

  let nameInput = document.getElementById("name").value;

  const name = nameInput && nameInput.trim() !== "" 
    ? nameInput 
    : (defaultName || "Jogador");

  update(ref(db,'rooms/'+roomId+'/players/'+playerId),{
    name: name,
    score:0
  });

  listen();
}


// 🔥 LISTENER
function listen(){
  onValue(ref(db,'rooms/'+roomId),(snap)=>{
    const data = snap.val();
    if(!data) return;

    document.getElementById("roomCode").innerText = roomId;

    const list = Object.entries(data.players || {});

    document.getElementById("players").innerHTML =
      list.map(([id,p])=>`<div>${p.name} - ${p.score || 0}</div>`).join('');

    if(data.started){
      startGame();
    }
  });

  QRCode.toCanvas(
    document.getElementById("qr"),
    window.location.href + "?room=" + roomId
  );
}


// 🔥 INICIAR
function start(){
  update(ref(db,'rooms/'+roomId),{started:true});
}


// 🎮 INICIAR JOGO
function startGame(){
  document.body.innerHTML = document.getElementById("gameContainer").outerHTML;
  initGame();
}


// 🎯 PERGUNTAS
const questions = [
  {
    q:"Quanto é 2 + 2?",
    a:["3","4","5"],
    correct:1
  },
  {
    q:"Capital do Brasil?",
    a:["Rio","Brasília","SP"],
    correct:1
  }
];

let current = 0;


// 🎮 LOGICA DO JOGO
function initGame(){
  showQuestion();
}

function showQuestion(){
  const q = questions[current];

  document.getElementById("question").innerText = q.q;

  document.getElementById("answers").innerHTML =
    q.a.map((ans,i)=>`
      <div class="answer" onclick="answer(${i})">${ans}</div>
    `).join('');
}


// 🎯 RESPONDER
window.answer = function(i){
  const q = questions[current];

  if(i === q.correct){
    alert("Correto!");
    update(ref(db,'rooms/'+roomId+'/players/'+playerId),{
      score: incrementScore()
    });
  }else{
    alert("Errado!");
  }

  current++;

  if(current < questions.length){
    showQuestion();
  }else{
    alert("Fim de jogo!");
  }
}


// 🔢 SCORE LOCAL
let localScore = 0;
function incrementScore(){
  localScore++;
  return localScore;
}


// 🔥 GLOBAL
window.createRoom = createRoom;
window.joinRoom = joinRoom;
window.start = start;

</script>

</body>
</html>
