<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MindArena PRO</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#0b1320;
  color:white;
}

button{
  padding:10px;
  margin:5px;
  cursor:pointer;
}

.hidden{display:none;}

.grid{
  display:grid;
  grid-template-columns: repeat(6,60px);
  gap:5px;
  justify-content:center;
}

.cell{
  background:white;
  color:black;
  padding:15px;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- LOBBY -->
<div id="lobby">
<h1>MindArena</h1>

<button onclick="createRoom()">Criar Sala</button><br>
<input id="room" placeholder="Código"><br>
<input id="name" placeholder="Nome"><br>
<button onclick="joinRoom()">Entrar</button>

<h2 id="roomCode"></h2>
<canvas id="qr"></canvas>

<div id="players"></div>
<button onclick="start()">Iniciar</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">
<h1>Sequência Numérica</h1>

<p>Tempo: <span id="time">0</span>s</p>
<p>Erros: <span id="errors">0</span></p>
<p>Próximo: <span id="current">1</span></p>

<div id="gameArea"></div>

<button onclick="startGame()">Reiniciar</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_lRiGKF3c8ILfn2lKNPEWL5mC7voSYBQ",
  authDomain: "neuropsi-bcee0.firebaseapp.com",
  databaseURL: "https://neuropsi-bcee0-default-rtdb.firebaseio.com",
  projectId: "neuropsi-bcee0",
  storageBucket: "neuropsi-bcee0.firebasestorage.app",
  messagingSenderId: "882652217132",
  appId: "1:882652217132:web:2beba920b4e4a0298cf689"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = "";
let playerId = "p" + Date.now();

// GAME STATE
let current = 1;
let errors = 0;
let time = 0;
let timerInterval;

// 🔥 CREATE ROOM
function createRoom(){
  roomId = Math.random().toString(36).substr(2,4).toUpperCase();

  set(ref(db,'rooms/'+roomId),{
    started:false,
    players:{}
  });

  document.getElementById("room").value = roomId;
  joinRoom("Host");
}

// 🔥 JOIN ROOM
function joinRoom(defaultName){
  roomId = document.getElementById("room").value || roomId;

  let nameInput = document.getElementById("name").value;

  const name = nameInput && nameInput.trim() !== "" 
    ? nameInput 
    : (defaultName || "Jogador");

  update(ref(db,'rooms/'+roomId+'/players/'+playerId),{
    name: name
  });

  listen();
}

// 🔥 LISTEN
function listen(){
  onValue(ref(db,'rooms/'+roomId),(snap)=>{
    const data = snap.val();
    if(!data) return;

    document.getElementById("roomCode").innerText = roomId;

    const list = Object.values(data.players || {});
    document.getElementById("players").innerHTML =
      list.map(p=>`<div>${p.name}</div>`).join('');

    if(data.started){
      document.getElementById("lobby").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
      startGame();
    }
  });

  QRCode.toCanvas(
    document.getElementById("qr"),
    window.location.href + "?room=" + roomId
  );
}

// 🔥 START GAME
function start(){
  update(ref(db,'rooms/'+roomId),{started:true});
}

//////////////////////////////////////////////////
// 🎮 GAME LOGIC
//////////////////////////////////////////////////

function startGame(){

  current = 1;
  errors = 0;
  time = 0;

  document.getElementById("errors").innerText = errors;
  document.getElementById("current").innerText = current;
  document.getElementById("time").innerText = time;

  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    time++;
    document.getElementById("time").innerText = time;
  },1000);

  const nums = Array.from({length:36},(_,i)=>i+1)
    .sort(()=>Math.random()-0.5);

  const area = document.getElementById("gameArea");

  area.innerHTML = `<div class="grid" id="grid"></div>`;

  const grid = document.getElementById("grid");

  nums.forEach(n=>{
    const div = document.createElement("div");
    div.className = "cell";
    div.innerText = n;
    div.dataset.value = n;

    div.onclick = ()=>{

      if(parseInt(div.dataset.value) === current){

        div.style.background = "green";
        div.style.color = "white";

        current++;
        document.getElementById("current").innerText = current;

        if(current > 36){
          clearInterval(timerInterval);
          alert(`Finalizado!\nTempo: ${time}s\nErros: ${errors}`);
        }

      }else{

        errors++;
        document.getElementById("errors").innerText = errors;

        div.style.background = "red";
        setTimeout(()=>{
          div.style.background = "white";
        },300);
      }
    };

    grid.appendChild(div);
  });
}

//////////////////////////////////////////////////

window.createRoom = createRoom;
window.joinRoom = joinRoom;
window.start = start;

</script>

</body>
</html>
