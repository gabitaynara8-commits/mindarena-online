<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MindArena Online</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#0b1320;
  color:white;
}
button{
  padding:10px;
  margin:5px;
  cursor:pointer;
}
#gameArea{
  margin-top:20px;
}
</style>
</head>

<body>

<h1>MindArena</h1>

<div id="lobby">
  <button onclick="createRoom()">Criar Sala</button><br>
  <input id="room" placeholder="Código"><br>
  <input id="name" placeholder="Nome"><br>
  <button onclick="joinRoom()">Entrar</button>

  <h2 id="roomCode"></h2>
  <canvas id="qr"></canvas>
  <div id="players"></div>

  <button id="startBtn" onclick="start()">Iniciar</button>
</div>

<div id="game" style="display:none;"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_lRiGKF3c8ILfn2lKNPEWL5mC7voSYBQ",
  authDomain: "neuropsi-bcee0.firebaseapp.com",
  databaseURL: "https://neuropsi-bcee0-default-rtdb.firebaseio.com",
  projectId: "neuropsi-bcee0",
  storageBucket: "neuropsi-bcee0.firebasestorage.app",
  messagingSenderId: "882652217132",
  appId: "1:882652217132:web:2beba920b4e4a0298cf689"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = "";
let playerId = "p" + Date.now();
let isHost = false;


// 🔥 CRIAR SALA
function createRoom(){
  roomId = Math.random().toString(36).substr(2,4).toUpperCase();

  set(ref(db,'rooms/'+roomId),{
    started:false,
    players:{}
  });

  document.getElementById("room").value = roomId;

  isHost = true;

  joinRoom("Host");
}


// 🔥 ENTRAR NA SALA
function joinRoom(defaultName){
  roomId = document.getElementById("room").value || roomId;

  let nameInput = document.getElementById("name").value;

  const name = nameInput && nameInput.trim() !== "" 
    ? nameInput 
    : (defaultName || "Jogador");

  update(ref(db,'rooms/'+roomId+'/players/'+playerId),{
    name: name,
    score: 0
  });

  listen();
}


// 🔥 ESCUTAR TEMPO REAL
function listen(){
  onValue(ref(db,'rooms/'+roomId),(snap)=>{
    const data = snap.val();
    if(!data) return;

    document.getElementById("roomCode").innerText = roomId;

    const players = data.players || {};
    const list = Object.entries(players);

    document.getElementById("players").innerHTML =
      list.map(([id,p])=>`<div>${p.name}</div>`).join('');

    // 🔥 DEFINE HOST (primeiro jogador)
    const firstPlayer = Object.keys(players)[0];
    isHost = playerId === firstPlayer;

    document.getElementById("startBtn").style.display = isHost ? "inline-block" : "none";

    // 🔥 INICIO DO JOGO
    if(data.started){
      loadGame(players);
    }
  });

  QRCode.toCanvas(
    document.getElementById("qr"),
    window.location.href + "?room=" + roomId
  );
}


// 🔥 INICIAR JOGO
function start(){
  if(!isHost) return;
  update(ref(db,'rooms/'+roomId),{started:true});
}


// 🔥 TROCAR PARA TELA DO JOGO
function loadGame(players){

  document.getElementById("lobby").style.display = "none";
  document.getElementById("game").style.display = "block";

  document.getElementById("game").innerHTML = `
    <h1>🎮 Jogo iniciado!</h1>
    <p>Sala: ${roomId}</p>
    <div id="gameArea"></div>
    <h3>Placar</h3>
    <div id="scoreboard"></div>
  `;

  startGame(players);
}


// 🔥 LÓGICA DO JOGO (EXEMPLO)
function startGame(players){

  const gameArea = document.getElementById("gameArea");

  gameArea.innerHTML = `
    <p>Clique rápido para ganhar pontos!</p>
    <button id="clickBtn">CLIQUE!</button>
  `;

  document.getElementById("clickBtn").onclick = ()=>{
    const playerRef = ref(db,'rooms/'+roomId+'/players/'+playerId);

    update(playerRef,{
      score: (Math.random()*10|0) + 1
    });
  };

  // 🔥 ATUALIZA PLACAR EM TEMPO REAL
  onValue(ref(db,'rooms/'+roomId+'/players'),(snap)=>{
    const data = snap.val() || {};

    document.getElementById("scoreboard").innerHTML =
      Object.values(data)
        .map(p=>`<div>${p.name}: ${p.score}</div>`)
        .join('');
  });
}


// 🔥 GLOBAL
window.createRoom = createRoom;
window.joinRoom = joinRoom;
window.start = start;

</script>

</body>
</html>

</body>
</html>
